name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # database tests: each service migrates and tests its own database
      - run: PGPASSWORD=app psql -h localhost -U app -d app -c "CREATE DATABASE auth_test" -c "CREATE DATABASE stock_test"
      - run: npx prisma migrate deploy && npx jest integration
        working-directory: services/auth
        env: { DATABASE_URL: postgresql://app:app@localhost:5432/auth_test }
      - run: npx prisma migrate deploy && npx jest integration
        working-directory: services/stock
        env: { DATABASE_URL: postgresql://app:app@localhost:5432/stock_test }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: timeout 180 sh -c 'until curl -sf http://localhost:3030/login >/dev/null; do sleep 3; done'
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - if: failure()
        run: docker compose logs
