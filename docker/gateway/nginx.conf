# API gateway: one public address for the web app, routed by path to each service.
events {}

http {
  # Docker's DNS, resolved per request: the gateway starts even if a service is still booting or restarts
  resolver 127.0.0.11 valid=10s;

  server {
    listen 3031;

    set $auth    http://auth:3000;
    set $stock   http://stock:3000;
    set $reports http://reports:3000;

    location /auth/     { proxy_pass $auth; }
    location /users     { proxy_pass $auth; }
    location /products  { proxy_pass $stock; }
    location /movements { proxy_pass $stock; }
    location /webhooks/live-orders { proxy_pass $stock; }
    location /audit/auth  { proxy_pass $auth; }
    location /audit/stock { proxy_pass $stock; }
    location /dashboard { proxy_pass $reports; }
    location /inventory { proxy_pass $reports; }

    location / { return 404; }
  }
}
